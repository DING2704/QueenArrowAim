
name: Build Queen Arrow Aim APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QueenArrowAim_Android_Prototype.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -q QueenArrowAim_Android_Prototype.zip -d source

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/QueenArrowAimAndroid/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          p.write_text(s)
          print("Java JVM target set to 17")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: source/QueenArrowAimAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QueenArrowAim-debug-apk
          path: source/QueenArrowAimAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
